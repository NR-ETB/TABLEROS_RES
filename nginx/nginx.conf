server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/json text/css application/javascript;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /data/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}
